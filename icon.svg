<?xml version="1.0" encoding="UTF-8"?>
<!--
  PostScript Programming Language - extension icon (source artwork).

  The mark is the PostScript file magic number "%!" that every .ps file starts
  with, drawn as pure geometry (no typeface involved) so it renders identically
  at any size and carries no font licensing. Original artwork, licensed under
  the same terms as this project (LGPL-3.0-only).

  Rendered to icon.png (128x128) with @resvg/resvg-js. Keep both files in sync:
  edit this SVG, then re-render the PNG.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233C"/>
      <stop offset="0.55" stop-color="#0E1729"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.16" r="0.72">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="128" height="128" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="128" height="128" fill="url(#ink)"/>
    <rect width="128" height="128" fill="url(#glow)"/>
  </g>

  <!-- percent sign -->
  <g fill="none" stroke="#F8FAFC" stroke-width="9" stroke-linecap="round">
    <circle cx="43.5" cy="43" r="11.5"/>
    <circle cx="65.5" cy="85" r="11.5"/>
    <line x1="70" y1="29" x2="39" y2="99"/>
  </g>

  <!-- exclamation mark -->
  <g fill="#2DD4BF">
    <rect x="86.5" y="28.5" width="11.5" height="51" rx="5.75"/>
    <circle cx="92.25" cy="92.5" r="6.25"/>
  </g>

  <!-- inner hairline for definition on light backgrounds -->
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="25.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
</svg>
