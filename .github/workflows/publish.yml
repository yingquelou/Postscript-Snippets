name: Publish Extension

# 推送 v* 标签（如 v1.1.7）时构建并发布到两个注册表：
#   - VS Code Marketplace：OIDC 可信发布（vsce publish --oidc）
#   - Open VSX：OIDC 可信发布（ovsx publish --trusted-publishing）
# 两个注册表都不再使用长期凭据，仓库里不需要 VSCE_PAT / OVSX_PAT。
# 也可以在 Actions 页面手动触发，默认只构建不发布（dry_run）。
#
# 首次迁移需要手工完成的一次性配置（详见发布说明）：
#   1. Marketplace：Marketplace 管理页 → Publisher yingquelou → Trusted Publishing
#      新建策略，Repository owner=yingquelou，Repository=Postscript-Snippets，
#      Workflow=publish.yml，Environment 留空。
#   2. Open VSX：该注册表要求命名空间已验证、且扩展已有活跃版本，才允许登记
#      Trusted Publisher。因此首个版本仍需用 PAT 手工推一次，之后在
#      open-vsx.org → Settings → Trusted Publishers 登记同样的仓库与工作流。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build and verify the VSIX, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  VSIX_FILE: postscriptsnippets.vsix
  EXTENSION_NAME: postscriptsnippets
  PUBLISHER: yingquelou

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    # 请求 GitHub OIDC ID token 所需；两个注册表都用它换取短时凭据。
    # 注意：job 级 permissions 会整体覆盖 workflow 级设置，因此 contents 要重申。
    permissions:
      contents: read
      id-token: write
    # 可选加固：如需发布前人工审批，取消下一行注释，并在 Marketplace 的
    # Trusted Publishing 策略与 Open VSX 的 Trusted Publisher 注册里都把
    # Environment 填成同名值（两边必须完全一致，否则鉴权失败）。
    # environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 仓库未纳入 pnpm-lock.yaml，因此使用 --no-frozen-lockfile
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # dictionaryStackManager 的测试会实际 spawn Ghostscript 加载 systemdict
      - name: Install Ghostscript
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ghostscript
          gs --version

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "package.json version: $pkg_version"
          echo "git tag version:      $tag_version"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      # 可信发布的前提是“没有任何长期凭据参与”。--pat / OVSX_PAT 的优先级
      # 高于 OIDC，一旦被注入就会静默退回 PAT 认证，等于没迁移，所以这里硬拦。
      - name: Ensure no long-lived publishing token is present
        shell: bash
        run: |
          status=0
          for name in VSCE_PAT OVSX_PAT; do
            if [ -n "${!name:-}" ]; then
              echo "::error::$name is set. Trusted publishing must run without a PAT; remove the secret or the env binding."
              status=1
            fi
          done
          exit $status

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # prepackage 会先清空 out/ 再重新构建，确保只打包两个 esbuild 产物
      - name: Build and package
        run: npm run package -- --out "$VSIX_FILE"

      - name: Verify VSIX contents
        shell: bash
        run: |
          unzip -Z1 "$VSIX_FILE" > vsix-contents.txt
          cat vsix-contents.txt

          required=(
            "extension/out/extension.js"
            "extension/out/debugger/debugAdapter.js"
            "extension/.snippets/snippet-index.json"
            "extension/language/postscript.tmLanguage.json"
            "extension/language/postscript.config.schema.json"
            "extension/ps/dap.ps"
            "extension/ps/dictionaryStack.ps"
            "extension/readme.md"
            "extension/LICENSE.txt"
          )

          status=0
          for path in "${required[@]}"; do
            if grep -qx "$path" vsix-contents.txt; then
              echo "OK    $path"
            else
              echo "::error::Missing $path in $VSIX_FILE"
              status=1
            fi
          done

          out_files="$(grep -c '^extension/out/' vsix-contents.txt || true)"
          echo "files under extension/out/: $out_files (expected 2)"
          if [ "$out_files" -ne 2 ]; then
            echo "::error::extension/out/ must contain exactly the 2 bundled files, found $out_files"
            status=1
          fi

          # 防止绕过 npm 钩子直接 `vsce package`：那样 out/ 里是 tsc 产物而不是 esbuild bundle
          bundle="$RUNNER_TEMP/extension-entry.js"
          unzip -p "$VSIX_FILE" extension/out/extension.js > "$bundle"
          if head -c 4000 "$bundle" | grep -q 'require("\./'; then
            echo "::error::extension/out/extension.js looks like unbundled TypeScript output; use 'npm run package', not 'npx vsce package'"
            status=1
          else
            echo "OK    extension/out/extension.js is a self-contained bundle ($(wc -c < "$bundle") bytes)"
          fi

          exit $status

      # Open VSX 的可信发布有硬性前置：命名空间已验证 + 扩展已有活跃版本。
      # 两者都不由本工作流控制，缺任意一项时 ovsx 会直接失败，因此先探测、
      # 再决定是否发布，避免每次发布都因外部状态报错。
      - name: Check Open VSX trusted publishing prerequisites
        id: preflight
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        shell: bash
        run: |
          ns_code="$(curl -sS -o /tmp/ns.json -w '%{http_code}' "https://open-vsx.org/api/$PUBLISHER" || echo 000)"
          ext_code="$(curl -sS -o /tmp/ext.json -w '%{http_code}' "https://open-vsx.org/api/$PUBLISHER/$EXTENSION_NAME" || echo 000)"

          verified=false
          if [ "$ns_code" = "200" ]; then
            verified="$(python3 -c "import json;print(str(json.load(open('/tmp/ns.json')).get('verified', False)).lower())" 2>/dev/null || echo false)"
          fi

          echo "namespace HTTP: $ns_code (verified=$verified)"
          echo "extension HTTP: $ext_code"

          if [ "$ns_code" = "200" ] && [ "$verified" = "true" ] && [ "$ext_code" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Open VSX prerequisites met: verified namespace and an active version exist."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Open VSX. Trusted publishing requires a verified namespace (verified=$verified) and an already-active extension version (HTTP $ext_code). Publish the first version with a PAT, then register the trusted publisher on open-vsx.org and delete OVSX_PAT."
          fi

      # 两个注册表相互独立：任一方失败都不应阻止另一方发布，
      # 失败情况由最后的汇总步骤统一报告。
      - name: Publish to VS Code Marketplace
        id: marketplace
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        continue-on-error: true
        shell: bash
        run: |
          # GitHub OIDC token 换取 Marketplace 凭据，有效期 15 分钟，不落盘
          if ! npx vsce publish --packagePath "$VSIX_FILE" --oidc --skip-duplicate; then
            echo "::error::Marketplace OIDC publish failed. Confirm the Trusted Publishing policy on publisher '$PUBLISHER' names owner=yingquelou, repo=Postscript-Snippets, workflow=publish.yml (and the same environment, if any), and that this job grants id-token: write."
            exit 1
          fi

      - name: Publish to Open VSX
        id: openvsx
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true && steps.preflight.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          # 命名空间已存在、扩展已有活跃版本，因此不再执行 create-namespace / verify-pat
          # （这两个子命令只接受 PAT）。--trusted-publishing 在拿不到 ID token 时会
          # 直接失败，而不是静默退回 PAT，正好用来兜住配置错误。
          npx --yes ovsx@1.3.0 publish "$VSIX_FILE" --trusted-publishing --skip-duplicate

      - name: Summarize publish results
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        shell: bash
        env:
          MARKETPLACE_RESULT: ${{ steps.marketplace.outcome }}
          OPENVSX_RESULT: ${{ steps.openvsx.outcome }}
          OPENVSX_READY: ${{ steps.preflight.outputs.ready }}
        run: |
          if [ "$OPENVSX_RESULT" = "skipped" ] && [ "$OPENVSX_READY" != "true" ]; then
            OPENVSX_RESULT="skipped (prerequisites not met)"
          fi

          echo "VS Code Marketplace: $MARKETPLACE_RESULT"
          echo "Open VSX:            $OPENVSX_RESULT"
          {
            echo "## Publish results (OIDC trusted publishing)"
            echo ""
            echo "| Registry | Method | Result |"
            echo "| --- | --- | --- |"
            echo "| VS Code Marketplace | \`vsce publish --oidc\` | $MARKETPLACE_RESULT |"
            echo "| Open VSX | \`ovsx publish --trusted-publishing\` | $OPENVSX_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MARKETPLACE_RESULT" != "success" ]; then
            echo "::error::VS Code Marketplace publish failed - see the step log above"
            exit 1
          fi
          if [ "$OPENVSX_READY" = "true" ] && [ "$OPENVSX_RESULT" != "success" ]; then
            echo "::error::Open VSX publish failed - see the step log above"
            exit 1
          fi

      - name: Upload VSIX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postscriptsnippets-${{ github.ref_name }}
          path: ${{ env.VSIX_FILE }}
          if-no-files-found: warn
          retention-days: 14
