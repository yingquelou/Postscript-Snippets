name: CI

# 每次推送到 main 或提交 PR 时验证：类型检查 + 单元测试 + 打包完整性。
# 打包校验放在 CI 里，是为了在真正发布前发现「out/ 被 tsc 产物污染」这类问题。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm-lock.yaml 已纳入版本控制：锁定安装，保证 CI/发布可复现
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # dictionaryStackManager 的测试会实际 spawn Ghostscript 加载 systemdict
      - name: Install Ghostscript (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ghostscript
          gs --version

      # choco 安装后当前会话的 PATH 不会刷新，需要显式写入 GITHUB_PATH
      - name: Install Ghostscript (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ghostscript -y --no-progress
          $exe = Get-ChildItem "C:\Program Files\gs" -Recurse -Filter gswin64c.exe |
            Select-Object -First 1
          if (-not $exe) { throw "gswin64c.exe not found after install" }
          Write-Host "Found $($exe.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
          & $exe.FullName --version

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # PS 语义以解释器为准：这三个脚本用真实 gs 复核 ps/ 下的文件、mark 语义断言
      # 与 L3/build-trace 的命令构造，和单测一起构成"PS 代码必须经 gs 验证"的闸门。
      # 脚本在找不到 gs 时自行 SKIP，不会把缺少解释器误报成失败。
      - name: Verify PostScript semantics with Ghostscript
        run: npm run verify

      - name: Build and package
        run: npm run package -- --out postscriptsnippets.vsix

      # contributes.snippets 是 postbuild 注入、打包后移除的字段：它登记的是
      # .snippets/*.json（由 Operators.md 生成、git 不追踪的产物），一旦入库就是
      # 手工维护的第二份副本。这里同时断言"HEAD 里没有"和"打包后已还原"，
      # 让自动清理失效变成红叉，而不是靠人眼从 git status 里发现。
      - name: Assert generated snippets field is not tracked
        shell: bash
        run: |
          node - <<'NODE'
          const { execSync } = require('child_process')
          const manifest = JSON.parse(execSync('git show HEAD:package.json', { encoding: 'utf8' }))
          if (manifest.contributes && 'snippets' in manifest.contributes) {
            console.error('::error::package.json in git contains contributes.snippets; it must be generated at build time only')
            process.exit(1)
          }
          console.log('OK    HEAD manifest has no generated snippets field')
          NODE

          if ! git diff --quiet -- package.json; then
            echo "::error::package.json still carries the generated snippets field after packaging; the restore step did not run"
            git diff -- package.json | head -40
            exit 1
          fi
          echo "OK    package.json restored to its tracked state"

      - name: Verify VSIX contents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unzip -Z1 postscriptsnippets.vsix > vsix-contents.txt

          required=(
            "extension/out/extension.js"
            "extension/out/debugger/debugAdapter.js"
            "extension/.snippets/snippet-index.json"
            "extension/language/postscript.tmLanguage.json"
            "extension/ps/dap.ps"
            "extension/readme.md"
          )

          status=0
          for path in "${required[@]}"; do
            if grep -qx "$path" vsix-contents.txt; then
              echo "OK    $path"
            else
              echo "::error::Missing $path in the VSIX"
              status=1
            fi
          done

          out_files="$(grep -c '^extension/out/' vsix-contents.txt || true)"
          echo "files under extension/out/: $out_files (expected 2)"
          if [ "$out_files" -ne 2 ]; then
            echo "::error::extension/out/ must contain exactly the 2 bundled files, found $out_files"
            status=1
          fi

          # 防止绕过 npm 钩子直接 `vsce package`：那样 out/ 里是 tsc 产物而不是 esbuild bundle
          bundle="$RUNNER_TEMP/extension-entry.js"
          unzip -p postscriptsnippets.vsix extension/out/extension.js > "$bundle"
          if head -c 4000 "$bundle" | grep -q 'require("\./'; then
            echo "::error::extension/out/extension.js looks like unbundled TypeScript output; use 'npm run package', not 'npx vsce package'"
            status=1
          else
            echo "OK    extension/out/extension.js is a self-contained bundle ($(wc -c < "$bundle") bytes)"
          fi

          echo "VSIX size: $(du -h postscriptsnippets.vsix | cut -f1)"
          exit $status

      - name: Upload VSIX artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: postscriptsnippets-vsix
          path: postscriptsnippets.vsix
          if-no-files-found: error
          retention-days: 7
